            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessagesResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
