openapi: 3.0.3
info:
  title: Memory Gateway API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Memory Gateway 对外提供三类 API：

    - **管理 API** (`/api/*`)：团队 / API Key / 健康看板 / 系统管理
    - **网关 API** (`/v1/*` 及协议别名路由)：LLM 请求代理，支持 Anthropic Messages、OpenAI Chat Completions、OpenAI Responses 三种协议
    - **MCP 内部 API** (`/api/mcp/*`)：供 MCP Server 调用的内部接口

    除 `GET /health` 外，所有端点均需认证。认证方式为 `Authorization: Bearer <api_key>`，
    或 `x-api-key: <api_key>` 请求头。API Key 通过 `POST /api/api-keys` 创建（明文仅创建时返回一次）。

    MCP 端点额外要求 API Key 的 scopes 包含 `"mcp"`。

    网关 LLM 端点支持幂等性保障：携带 `Idempotency-Key` 请求头时，24 小时内相同 Key + 相同请求体返回缓存的响应。

servers:
  - url: http://127.0.0.1:8096
    description: 本地开发环境（生产环境 URL 取决于部署配置）

tags:
  - name: Health
    description: 健康检查（无需认证）
  - name: Teams
    description: 团队管理
  - name: APIKeys
    description: API Key 管理
  - name: RecordingHealth
    description: 录入健康看板
  - name: System
    description: 系统管理（服务启停 / 自动启动 / 日志 / 配置备份恢复）
  - name: IdentityCards
    description: 身份卡 Agent 绑定
  - name: MCP
    description: MCP 内部 API（需 mcp scope）
  - name: Gateway
    description: LLM 代理端点（需 gateway scope）

paths:
  /health:
    get:
      tags: [Health]
      summary: 获取服务健康状态
      operationId: getHealth
      description: 无需认证。检查数据库连通性与 journal mode。
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, journal_mode, version]
                properties:
                  status:
                    type: string
                    enum: [healthy]
                    example: healthy
                  journal_mode:
                    type: string
                    example: wal
                  version:
                    type: string
                    example: 1.0.0
        "503":
          description: 服务不可用（数据库连接失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unhealthy]
                  error:
                    type: string
                    example: database connection failed

  /api/teams:
    get:
      tags: [Teams]
      summary: 列出所有团队
      operationId: listTeams
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 团队列表（排除 archived）
          content:
            application/json:
              schema:
                type: object
                required: [teams, total]
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
                  total:
                    type: integer
                    example: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Teams]
      summary: 创建新团队
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: slug 已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{team_id}:
    get:
      tags: [Teams]
      summary: 获取团队详情
      operationId: getTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: 团队详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/api-keys:
    get:
      tags: [APIKeys]
      summary: 列出 API Keys（不含明文）
      operationId: listAPIKeys
      security:
        - bearerAuth: []
      parameters:
        - name: team_id
          in: query
          required: false
          description: 按团队过滤
          schema:
            type: string
      responses:
        "200":
          description: API Key 列表（仅前缀，无明文）
          content:
            application/json:
              schema:
                type: object
                required: [api_keys, total]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
                  total:
                    type: integer
                    example: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [APIKeys]
      summary: 创建 API Key
      operationId: createAPIKey
      description: 明文 Key 仅在创建时返回一次，请妥善保存。默认 scopes 为 `["gateway","mcp"]`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: 创建成功（含一次性明文 Key）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/recording-health:
    get:
      tags: [RecordingHealth]
      summary: 获取录入健康看板数据
      operationId: getRecordingHealth
      description: 返回按 request 维度投影的录入状态，供 Web 面板使用。行数据按认证团队作用域隔离。
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页数量（默认 50，最大 100）
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          required: false
          description: 偏移量（默认 0）
          schema:
            type: integer
            default: 0
        - name: terminal_status
          in: query
          required: false
          description: 按终止状态过滤（如 complete / failed / cancelled）
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: terminal_status 的别名参数，优先使用 terminal_status
          schema:
            type: string
      responses:
        "200":
          description: 录入健康记录
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordingHealthEntry"
                  total:
                    type: integer
                    example: 1234
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/system/service/start:
    post:
      tags: [System]
      summary: 启动 Gateway 服务
      operationId: startService
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 启动指令已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: service start initiated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 服务已在运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/system/service/stop:
    post:
      tags: [System]
      summary: 停止 Gateway 服务（自终止）
      operationId: stopService
      description: 返回成功后约 1 秒进程退出。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 停止指令已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: service stop initiated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/system/service/restart:
    post:
      tags: [System]
      summary: 重启 Gateway 服务
      operationId: restartService
      description: 返回成功后先拉起新实例再退出当前实例。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 重启指令已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: service restart initiated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/system/service/status:
    get:
      tags: [System]
      summary: 获取服务运行状态
      operationId: getServiceStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/system/autostart:
    put:
      tags: [System]
      summary: 配置开机自启动
      operationId: setAutostart
      description: 仅 Windows 实现（Task Scheduler）；其他平台返回 501。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  example: true
      responses:
        "200":
          description: 自启动配置已更新
          content:
            application/json:
              schema:
                type: object
                required: [enabled, message]
                properties:
                  enabled:
                    type: boolean
                  message:
                    type: string
                    example: autostart configuration updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: 当前平台未实现自启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/system/logs:
    get:
      tags: [System]
      summary: 获取最近系统日志
      operationId: getSystemLogs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 日志条数（默认 100）
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: 日志条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/system/backup:
    post:
      tags: [System]
      summary: 导出系统配置备份
      operationId: backupConfig
      description: 响应带 `Content-Disposition` 附件头，返回 JSON 配置。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 配置备份（JSON）
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0
                  db_path:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/system/restore:
    post:
      tags: [System]
      summary: 导入系统配置备份
      operationId: restoreConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 由 POST /api/system/backup 导出的任意配置对象
              example:
                exported_at: 2026-08-19T10:00:00Z
                version: 1.0.0
                db_path: F:\memory_plus\gateway\data\gateway.db
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: configuration imported successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/system/config:
    get:
      tags: [System]
      summary: 获取系统配置
      operationId: getSystemConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 系统配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/identity-cards/{id}/bind-agent:
    post:
      tags: [IdentityCards]
      summary: 将 Agent 绑定到身份卡
      operationId: bindAgent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityCardID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  example: agent_def456
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/identity-cards/{id}/test-connection:
    post:
      tags: [IdentityCards]
      summary: 测试已绑定 Agent 的连接
      operationId: testAgentConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityCardID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
      responses:
        "200":
          description: 连接测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"
        "400":
          description: 未绑定 Agent 或参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # MCP 内部 API（需 mcp scope）
  # ---------------------------------------------------------------------------

  /api/mcp/memory/search:
    post:
      tags: [MCP]
      summary: 语义搜索记忆资产
      operationId: mcpMemorySearch
      description: 在团队记忆库中检索与 query 最相关的资产（FTS + 语义向量融合）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySearchRequest"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                required: [results, truncated]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemorySearchHit"
                  truncated:
                    type: boolean
                    description: 检索结果是否因 token 预算被截断
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/memory/get:
    post:
      tags: [MCP]
      summary: 获取单个记忆资产详情
      operationId: mcpMemoryGet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryGetRequest"
      responses:
        "200":
          description: 资产详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryGetResponse"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "404":
          $ref: "#/components/responses/MCPNotFound"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/memory/append:
    post:
      tags: [MCP]
      summary: 追加记忆资产（唯一的写工具）
      operationId: mcpMemoryAppend
      description: 经 SQLite 事务层写入 L1 资产。相同内容去重（内容哈希 slug），重复追加返回 409。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryAppendRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryAppendResponse"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "409":
          description: 相同内容的记忆已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/wiki/search:
    post:
      tags: [MCP]
      summary: 搜索 Wiki 页面
      operationId: mcpWikiSearch
      description: FTS5 优先，失败或未命中时回退 LIKE 扫描。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WikiSearchRequest"
      responses:
        "200":
          description: Wiki 搜索结果
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/WikiSearchHit"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/codegraph/impact:
    post:
      tags: [MCP]
      summary: 代码符号影响分析
      operationId: mcpCodeGraphImpact
      description: 查找符号/文件并沿调用方向遍历，返回受影响的调用方/被调方与文件列表。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeGraphImpactRequest"
      responses:
        "200":
          description: 影响分析结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeGraphImpactResponse"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "404":
          $ref: "#/components/responses/MCPNotFound"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/skill/search:
    post:
      tags: [MCP]
      summary: 搜索技能库
      operationId: mcpSkillSearch
      description: 按名称/显示名/触发边界子串匹配，可选状态与版本过滤。steps_summary 最多返回 3 步。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSearchRequest"
      responses:
        "200":
          description: 技能搜索结果
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillSearchHit"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/binding/get:
    post:
      tags: [MCP]
      summary: 获取会话绑定信息
      operationId: mcpBindingGet
      description: 按 conversation_id 或 session_id 查询会话绑定（team/agent/identity card）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingGetRequest"
      responses:
        "200":
          description: 绑定详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingGetResponse"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "404":
          $ref: "#/components/responses/MCPNotFound"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  /api/mcp/assets/list:
    post:
      tags: [MCP]
      summary: 列出团队记忆资产
      operationId: mcpAssetsList
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetsListRequest"
      responses:
        "200":
          description: 资产列表
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetListItem"
        "400":
          $ref: "#/components/responses/MCPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MCPForbidden"
        "500":
          $ref: "#/components/responses/MCPInternalError"

  # ---------------------------------------------------------------------------
  # 网关 LLM 代理端点（需认证 + 幂等性）
  # ---------------------------------------------------------------------------

  /v1/messages:
    post:
      tags: [Gateway]
      summary: 代理 Anthropic Messages API（默认通道）
      operationId: proxyAnthropicMessages
      description: |
        将请求代理到 team 的 `default` 上游通道。请求/响应结构与 Anthropic Messages API 一致（透传）。

        支持流式响应（请求体 `stream: true`，响应为 SSE）。

        幂等性：携带 `Idempotency-Key` 请求头时，24 小时内相同 Key 与相同请求体返回缓存响应，
        不重复调用上游。不同请求体复用同一 Key 返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessagesRequest"
      responses:
        "200":
          description: Anthropic Messages 响应（上游透传）
          headers:
            X-Request-ID:
              description: 网关生成的请求 ID
              schema:
                type: string
            X-Recording-Degraded:
              description: 录入降级标记（事件写入本地缓冲而非 SQLite 时存在）
              schema:
                type: string
                enum: [buffer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessagesResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/GatewayNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "502":
          $ref: "#/components/responses/GatewayUpstreamError"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /claude-code/{channel}/v1/messages:
    post:
      tags: [Gateway]
      summary: 代理 Anthropic Messages API（指定通道）
      operationId: proxyAnthropicMessagesChannel
      description: 与 `POST /v1/messages` 相同，通过路径参数指定上游通道名。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessagesRequest"
      responses:
        "200":
          description: Anthropic Messages 响应（上游透传）
          headers:
