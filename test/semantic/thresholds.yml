# Semantic Similarity Threshold Calibration
#
# This file defines language-specific thresholds for semantic validity assertions.
# These thresholds are used by ALL-155 acceptance tests to verify that the
# embedding implementation produces semantically meaningful vectors.
#
# Calibration methodology:
# 1. Prepare probe text pairs: synonymous pairs (same meaning, different wording)
#    and unrelated pairs (completely different topics)
# 2. Encode each text using the production embedding service
# 3. Compute cosine similarity for all pairs
# 4. Set thresholds based on observed distribution with safety margins
#
# Last calibrated: 2026-08-24
# Model: F:\AI\models\paraphrase-multilingual-MiniLM-L12-v2\model_quantized.onnx
# Dimensions: 384

version: 1

thresholds:
