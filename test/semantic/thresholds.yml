    synonym_min: 0.79     # Min observed 0.8393, margin -0.05
    unrelated_max: 0.10   # Max observed 0.0491, margin +0.05
    separation_min: 0.15  # Minimum separation: min(synonym) - max(unrelated)

    # Observed distribution (2026-08-24, paraphrase-multilingual-MiniLM-L12-v2):
